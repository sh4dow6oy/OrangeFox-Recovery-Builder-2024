name: OrangeFox r5q - Binary 9 Fix
on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        default: '12.1'
      DEVICE_TREE:
        description: 'Custom Device Tree'
        default: 'https://github.com/sh4dow6oy/android_device_samsung_r5q'
      DEVICE_TREE_BRANCH:
        description: 'Custom Device Tree Branch'
        default: 'android-9.0'
      DEVICE_PATH:
        description: 'Device Path'
        default: 'device/samsung/r5q'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare Environment
      run: |
        sudo apt update
        sudo apt install -y git python3 tar aria2 bc build-essential zip curl libssl-dev
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd .. /g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
    - name: Sync OrangeFox Sources
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
    - name: Patch & Fix Device Tree (Fastboot + System Fix)
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1/device/samsung/r5q
        
        # 1. Curățăm setările vechi (folosim rm ca să fim siguri că nu rămân dubluri)
        rm -f BoardConfig.mk recovery.fstab

        # 2. Reconstruim BoardConfig.mk (exact ca cel care s-a compilat + Fastboot)
        cat <<EOF > BoardConfig.mk
        # --- Display Settings ---
        TARGET_SCREEN_WIDTH := 1080
        TARGET_SCREEN_HEIGHT := 2400
        TW_THEME := portrait_hdpi
        TW_MAX_BRIGHTNESS := 255
        TW_DEFAULT_BRIGHTNESS := 150
        TW_BRIGHTNESS_PATH := "/sys/class/backlight/panel0-backlight/brightness"

        # --- Binary 9 / Android 13 Boot Fixes ---
        BOARD_BOOT_HEADER_VERSION := 2
        BOARD_INCLUDE_DTB := true
        BOARD_PREBUILT_DTBIMAGE := device/samsung/r5q/prebuilt/dtb.img
        BOARD_PREBUILT_DTBOIMAGE := device/samsung/r5q/prebuilt/dtbo.img
        TARGET_PREBUILT_KERNEL := device/samsung/r5q/prebuilt/kernel
        TARGET_FORCE_PREBUILT_KERNEL := true
        BOARD_KERNEL_CMDLINE := console=null androidboot.hardware=qcom androidboot.memcg=1 androidboot.selinux=permissive
        BOARD_MKBOOTIMG_ARGS := --header_version 2 --dtb device/samsung/r5q/prebuilt/dtb.img
        BOARD_RAMDISK_USE_LZ4 := true
        
        # --- Suport Partiții Dinamice (Ca să apară SYSTEM) ---
        BOARD_USES_DYNAMIC_PARTITIONS := true
        BOARD_BUILD_SYSTEM_ROOT_IMAGE := true
        BOARD_HAS_EROFS := true
        TARGET_RECOVERY_FSTYPE_MOUNT_OPTIONS := erofs=ro

        # --- ACTIVARE FASTBOOTD ---
        BOARD_RECOVERY_BINARIES += fastbootd

        # Fix-uri Build
        ALLOW_MISSING_DEPENDENCIES := true
        BUILD_BROKEN_DUP_RULES := true
        EOF

        # 3. Creăm recovery.fstab NOU (cu flag-ul logical ca să vadă System)
        cat <<EOF > recovery.fstab
        /system       erofs   system      display="System";logical;first_stage_mount
        /vendor       ext4    vendor      display="Vendor";logical;first_stage_mount
        /product      ext4    product     display="Product";logical;first_stage_mount
        /odm          ext4    odm         display="Odm";logical;first_stage_mount

        /boot         emmc    /dev/block/bootdevice/by-name/boot        flags=backup=1;flashimg=1
        /recovery     emmc    /dev/block/bootdevice/by-name/recovery    flags=backup=1;flashimg=1
        /metadata     ext4    /dev/block/bootdevice/by-name/metadata    display="Metadata"
        /data         f2fs    /dev/block/bootdevice/by-name/userdata    flags=fileencryption=ice:aes-256-cts
        /cache        ext4    /dev/block/bootdevice/by-name/cache
        /efs          ext4    /dev/block/bootdevice/by-name/efs          display="EFS";backup=1
        /dtbo         emmc    /dev/block/bootdevice/by-name/dtbo         display="DTBO";backup=1;flashimg=1

        /external_sd  vfat    /dev/block/mmcblk0p1 /dev/block/mmcblk0    flags=display="MicroSD";storage;wipeui;removable
        /usb-otg      vfat    /dev/block/sdg1      /dev/block/sdg        flags=display="USB-OTG";storage;wipeui;removable
        EOF

        # 4. Curățenie Vendor (obligatoriu pentru succes)
        find . -name "*.mk" -exec sed -i '/vendor\/omni/d' {} +
        find . -name "*.mk" -exec sed -i '/vendor\/twrp/d' {} +
    - name: Build OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch omni_r5q-eng
        mka recoveryimage -j$(nproc)
    - name: Upload Recovery
      uses: softprops/action-gh-release@v2
      if: success()
      with:
        files: |
          OrangeFox/fox_12.1/out/target/product/r5q/OrangeFox*.zip
          OrangeFox/fox_12.1/out/target/product/r5q/recovery.img
        name: OrangeFox-r5q-Binary9-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
