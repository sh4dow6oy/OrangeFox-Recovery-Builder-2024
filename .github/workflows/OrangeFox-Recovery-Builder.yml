name: OrangeFox r5q - Prebuilt Kernel Fix

on:
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        default: 'r5q'
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        default: '12.1'
      DEVICE_TREE:
        description: 'Custom Device Tree'
        default: 'https://github.com/sh4dow6oy/android_device_samsung_r5q'
      DEVICE_TREE_BRANCH:
        description: 'Custom Device Tree Branch'
        default: 'android-9.0'
      DEVICE_PATH:
        description: 'Device Path'
        default: 'device/samsung/r5q'
      BUILD_TARGET:
        description: 'Build Target'
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare Environment
      run: |
        sudo apt update
        sudo apt install -y git python3 tar aria2 bc build-essential zip curl libssl-dev
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd .. /g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh

    - name: Sync OrangeFox Sources
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}

    - name: Patch & Fix Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/${{ github.event.inputs.DEVICE_PATH }}
        
        # 1. FIX: "vendor/omni/config/common.mk does not exist"
        # Curățăm referințele la folderele de vendor care nu există în manifestul minimalist
        find . -name "*.mk" -exec sed -i '/vendor\/omni/d' {} +
        find . -name "*.mk" -exec sed -i '/vendor\/twrp/d' {} +
        
        # 2. FIX: "add_lunch_combo is obsolete"
        # Generăm AndroidProducts.mk corect pentru Android 12.1
        echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_r5q.mk" > AndroidProducts.mk
        echo "COMMON_LUNCH_CHOICES := omni_r5q-eng" >> AndroidProducts.mk
        rm -f vendorsetup.sh
        
        # 3. FIX: Redenumirea Kernel-ului și activarea Prebuilt-ului
        # Ne asigurăm că BoardConfig caută fișierul redenumit de tine 'kernel'
        sed -i 's/TARGET_PREBUILT_KERNEL := .*/TARGET_PREBUILT_KERNEL := $(DEVICE_PATH)\/prebuilt\/kernel/g' BoardConfig.mk
        sed -i 's/TARGET_FORCE_PREBUILT_KERNEL := .*/TARGET_FORCE_PREBUILT_KERNEL := true/g' BoardConfig.mk

        # 4. INJECTĂM FIX-URILE CRITICE (EROFS, Brightness, Dynamic Partitions)
        cat <<EOF >> BoardConfig.mk
        
        # --- OrangeFox Fixes for S10 Lite (r5q) ---
        # Brightness Fix (Previne eroarea ckati failed)
        TW_BRIGHTNESS_PATH := "/sys/class/backlight/panel0-backlight/brightness"
        TW_MAX_BRIGHTNESS := 255
        TW_DEFAULT_BRIGHTNESS := 150
        
        # EROFS & Partitioning (Necesare pentru Android 11/12/13)
        BOARD_HAS_EROFS := true
        TARGET_RECOVERY_FSTYPE_MOUNT_OPTIONS := erofs=ro
        BOARD_USES_DYNAMIC_PARTITIONS := true
        
        # UI & Screen Config
        DEVICE_SCREEN_WIDTH := 1080
        DEVICE_SCREEN_HEIGHT := 2400
        TW_THEME := portrait_hdpi
        
        # Safety Flags
        ALLOW_MISSING_DEPENDENCIES := true
        BUILD_BROKEN_DUP_RULES := true
        EOF

        # 5. FIX: /sbin/ paths pentru Android 12.1
        # Re-mapăm scripturile de inițializare pentru structura de Android 12
        find recovery/root -name "*.rc" -exec sed -i 's/\/sbin\//\/system\/bin\//g' {} +

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        set -e
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng
        
        mka ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Upload Recovery Image
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_12.1/out/target/product/r5q/*.img
          OrangeFox/fox_12.1/out/target/product/r5q/*.zip
        name: OrangeFox-r5q-S10Lite-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
