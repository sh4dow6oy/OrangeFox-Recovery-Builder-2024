name: OrangeFox r5q - Full Neutron Roynas Integrated

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cleanup Workspace
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison lz4 libssl-dev libelf-dev \
          ccache python3 python-is-python3 libarchive-tools wget zstd libtinfo6 zip gperf gcc-multilib g++-multilib git

      - name: Install Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Setup Neutron Clang
        run: |
          mkdir -p ${GITHUB_WORKSPACE}/clang
          wget -q https://github.com/Neutron-Toolchains/clang-build-catalogue/releases/download/10032024/neutron-clang-10032024.tar.zst
          tar -I zstd -xf neutron-clang-10032024.tar.zst -C ${GITHUB_WORKSPACE}/clang
          echo "${GITHUB_WORKSPACE}/clang/bin" >> $GITHUB_PATH

      - name: Sync OrangeFox Sources
        run: |
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1

      - name: Clone Device Tree & Roynas Kernel
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          # Clone Device Tree (r5q)
          git clone https://github.com/sh4dow6oy/android_device_samsung_r5q -b android-9.0 ./device/samsung/r5q
          # Clone Kernel Source (Roynas r3q/r5q)
          git clone https://github.com/sh4dow6oy/samsung_kernel_r5q -b master ./kernel/samsung/sm8150

      - name: Apply Roynas Nuclear Fixes & Patch Device Tree
        run: |
          # 1. FIX KERNEL SOURCE (Prevenim erorile de compilare Neutron)
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1/kernel/samsung/sm8150
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm -polly[^ ]*//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-mllvm//g' {} +
          find . -type f \( -name "Makefile*" -o -name "*.mk" \) -exec sed -i 's/-polly[^ ]*//g' {} +
          [ -f arch/arm64/kernel/vdso/Makefile ] && sed -i 's/-static//g' arch/arm64/kernel/vdso/Makefile
          sed -i 's/ifneq ($(wildcard $(srctree)\/scripts\/gcc-wrapper.py),)/ifeq (0,1)/g' Makefile

          # 2. PATCH DEVICE TREE (BoardConfig.mk)
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1/device/samsung/r5q
          sed -i 's/TARGET_FORCE_PREBUILT_KERNEL := .*/TARGET_FORCE_PREBUILT_KERNEL := false/g' BoardConfig.mk
          sed -i '/TARGET_PREBUILT_KERNEL/d' BoardConfig.mk

          cat <<EOF >> BoardConfig.mk
          # --- Kernel Build Settings ---
          TARGET_KERNEL_SOURCE := kernel/samsung/sm8150
          TARGET_KERNEL_CONFIG := r5q_defconfig
          BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb
          TARGET_KERNEL_CLANG_COMPILE := true
          
          # --- OrangeFox UI & Mount Fixes ---
          TW_MAX_BRIGHTNESS := 255
          TW_DEFAULT_BRIGHTNESS := 150
          TW_BRIGHTNESS_PATH := "/sys/class/backlight/panel0-backlight/brightness"
          BOARD_HAS_EROFS := true
          TARGET_RECOVERY_FSTYPE_MOUNT_OPTIONS := erofs=ro
          BOARD_USES_DYNAMIC_PARTITIONS := true
          DEVICE_SCREEN_WIDTH := 1080
          DEVICE_SCREEN_HEIGHT := 2400
          TW_THEME := portrait_hdpi
          ALLOW_MISSING_DEPENDENCIES := true
          EOF

          # 3. FIX RECOVERY.FSTAB (EROFS & Dynamic Partitions Support)
          cat <<EOF > recovery.fstab
          /system        erofs   system                logical;first_stage_mount
          /vendor        erofs   vendor                logical;first_stage_mount
          /product       erofs   product               logical;first_stage_mount
          /odm           erofs   odm                   logical;first_stage_mount
          /boot          emmc    /dev/block/bootdevice/by-name/boot
          /recovery      emmc    /dev/block/bootdevice/by-name/recovery
          /metadata      ext4    /dev/block/bootdevice/by-name/metadata
          /data          f2fs    /dev/block/bootdevice/by-name/userdata   flags=fileencryption=ice:aes-256-cts
          /cache         ext4    /dev/block/bootdevice/by-name/cache
          /efs           ext4    /dev/block/bootdevice/by-name/efs        display="EFS";backup=1
          /external_sd   vfat    /dev/block/mmcblk0p1 /dev/block/mmcblk0  flags=display="MicroSD";storage;wipeui;removable
          /usb_otg       vfat    /dev/block/sdg1 /dev/block/sdg           flags=display="USB-OTG";storage;wipeui;removable
          EOF

          # 4. FIX AndroidProducts.mk
          echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_r5q.mk" > AndroidProducts.mk
          echo "COMMON_LUNCH_CHOICES := omni_r5q-eng" >> AndroidProducts.mk
          rm -f vendorsetup.sh

      - name: Build OrangeFox
        run: |
          cd ${GITHUB_WORKSPACE}/OrangeFox/fox_12.1
          set +e
          source build/envsetup.sh
          set -e
          
          # Exportăm variabilele Neutron pentru kernel build
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KCFLAGS="-fcommon -Wno-error -Wno-unknown-warning-option -Wno-unused-command-line-argument"
          
          lunch omni_r5q-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Recovery
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OrangeFox/fox_12.1/out/target/product/r5q/OrangeFox*.zip
            OrangeFox/fox_12.1/out/target/product/r5q/recovery.img
          tag_name: ${{ github.run_id }}
          name: OrangeFox-r5q-Neutron-Roynas-${{ github.run_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
