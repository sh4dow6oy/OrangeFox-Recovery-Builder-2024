name: OrangeFox r5q - Final Fixed Build

on:
  workflow_dispatch:
    inputs:
      DEVICE_NAME:
        description: 'DEVICE_NAME'
        placeholder: 'r5q'
        default: 'r5q'
      MANIFEST_BRANCH:
        description: 'OrangeFox Manifest Branch'
        default: '12.1'
      DEVICE_TREE:
        description: 'Custom Device Tree'
        default: 'https://github.com/sh4dow6oy/android_device_samsung_r5q'
      DEVICE_TREE_BRANCH:
        description: 'Custom Device Tree Branch'
        default: 'android-9.0'
      DEVICE_PATH:
        description: 'Device Path'
        default: 'device/samsung/r5q'
      BUILD_TARGET:
        description: 'Build Target (recovery, boot, etc)'
        default: 'recovery'

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Workspace
      uses: rokibhasansagar/slimhub_actions@main

    - name: Prepare Environment
      run: |
        sudo apt update
        sudo apt install -y git python3 tar aria2 bc build-essential zip curl libssl-dev
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd .. /g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh

    - name: Sync OrangeFox Sources
        # Folosim calea din eroarea ta anterioara: OrangeFox/fox_12.1
      run: |
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh --branch ${{ github.event.inputs.MANIFEST_BRANCH }} --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree & Kernel
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        # Clonam Device Tree-ul indicat de tine
        git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
        
        # Clonam Common Tree-ul SM8150 (Necesar pentru Samsung QCOM)
        git clone https://github.com/sm8150-samsung/android_device_samsung_sm8150-common -b lineage-18.1 ./device/samsung/sm8150-common
        
        # Clonam Kernel-ul Roynas (Suporta EROFS si noile firmware-uri Samsung)
        git clone https://github.com/Roynas-Android-Playground/kernel_samsung_r3q -b master ./kernel/samsung/sm8150

    - name: Patch & Fix Device Tree (The "Chirurgia")
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}/${{ github.event.inputs.DEVICE_PATH }}
        
        # 1. FIX: "vendor/omni/config/common.mk does not exist"
        # Stergem orice referinta la vendor/omni sau vendor/twrp din tot tree-ul
        find . -name "*.mk" -exec sed -i '/vendor\/omni/d' {} +
        find . -name "*.mk" -exec sed -i '/vendor\/twrp/d' {} +
        find . -name "*.mk" -exec sed -i '/vendor\/lineage/d' {} +
        
        # 2. FIX: "add_lunch_combo is obsolete"
        # Cream un AndroidProducts.mk modern
        echo "PRODUCT_MAKEFILES := \$(LOCAL_DIR)/omni_r5q.mk" > AndroidProducts.mk
        echo "COMMON_LUNCH_CHOICES := omni_r5q-eng" >> AndroidProducts.mk
        rm -f vendorsetup.sh
        
        # 3. FIX: Suport EROFS si Partitii Dinamice (Obligatoriu pentru S10 Lite)
        # Injectam aceste linii in BoardConfig.mk trimis de tine
        cat <<EOF >> BoardConfig.mk
        # --- OrangeFox Fixes for r5q ---
        BOARD_HAS_EROFS := true
        TARGET_RECOVERY_FSTYPE_MOUNT_OPTIONS := erofs=ro
        BOARD_EROFS_PAGESIZE := 4096
        BOARD_EROFS_COMPRESSOR := lz4hc,9
        TARGET_USERIMAGES_USE_EROFS := true
        BOARD_USES_DYNAMIC_PARTITIONS := true
        TARGET_KERNEL_CONFIG := r5q_defconfig
        TARGET_KERNEL_SOURCE := kernel/samsung/sm8150
        ALLOW_MISSING_DEPENDENCIES := true
        BUILD_BROKEN_DUP_RULES := true
        EOF

        # 4. FIX: "recovery/root" paths pentru Android 12.1
        # In Android 12+, serviciile s-au mutat din /sbin
        find recovery/root -name "*.rc" -exec sed -i 's/\/sbin\//\/system\/bin\//g' {} +

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Building OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ github.event.inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        set -e
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        
        # Folosim omni_r5q pentru ca asa se numeste fisierul in repo-ul sh4dow6oy
        lunch omni_${{ github.event.inputs.DEVICE_NAME }}-eng
        
        mka ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)

    - name: Upload Recovery Image
      uses: softprops/action-gh-release@v2
      with:
        files: |
          OrangeFox/fox_12.1/out/target/product/r5q/*.img
          OrangeFox/fox_12.1/out/target/product/r5q/*.zip
        name: OrangeFox-r5q-S10Lite-${{ github.run_id }}
        tag_name: ${{ github.run_id }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
